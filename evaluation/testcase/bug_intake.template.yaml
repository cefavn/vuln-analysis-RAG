# =============================================================================
# QNX Hypervisor RAG Benchmark – Test Cases
# Schema version: 1.0
# Mục tiêu: Đánh giá khả năng phân tích lỗ hổng trong môi trường
#           guest-to-host boundary của QNX Hypervisor và các virt stacks
#           tương đồng về pattern.
# Tỉ lệ: 2 positive (known-vuln) / 1 negative (hardened path)
# =============================================================================

cases:

  # ---------------------------------------------------------------------------
  # CASE 1 – POSITIVE (In-domain QNX)
  # Pattern: Integer overflow trong calloc() dẫn đến undersized allocation →
  #          subsequent write gây heap corruption.
  # Source: CVE-2021-22156 (BadAlloc / QNX-2021-001)
  # Confidence: CONFIRMED – BlackBerry advisory + CISA advisory + NVD
  # ---------------------------------------------------------------------------
  - case_id: qnx-libc-calloc-001
    title: "BadAlloc – Integer overflow trong calloc() dẫn đến heap corruption"
    component: libc (C runtime library)
    binary_target: libcS.so / procnto (linked vào mọi QNX process)
    tags:
      - integer_overflow
      - heap_overflow
      - positive
      - qnx
      - in-domain
      - remote_exploitable
    prompt: >
      Analyze the calloc() implementation below focusing on the
      size computation path. Determine whether the multiplication
      nmemb * size can overflow a size_t before reaching the
      underlying allocator, and whether the resulting undersized
      allocation leads to a dangerous write path in the caller.

    analysis_context: |
      Target: QNX SDP C runtime library (libc) – calloc() function.
      Trust boundary: nmemb and size parameters may be attacker-controlled
      via network-facing services (e.g., HTTP, proprietary protocol parsers)
      that pass external input directly to calloc().
      Architecture: x86 / AArch64 (32-bit and 64-bit builds affected).
      Focus:
        1. Identify whether overflow check exists before nmemb * size.
        2. Trace the returned pointer into subsequent write operations.
        3. Classify the impact if allocation is undersized.

    source_code: |
      /*
       * QNX SDP 6.5.0 SP1 and earlier – simplified reconstruction of
       * the vulnerable calloc() logic in libc.
       * NOTE: This is a representative pseudocode based on public
       * BadAlloc (CVE-2021-22156) analysis; actual binary differs.
       */

      void *calloc(size_t nmemb, size_t size) {
          size_t total;

          /*
           * VULNERABLE PATH:
           * No overflow check before multiplication.
           * If nmemb=0x10000 and size=0x10001 on a 32-bit target:
           *   total = 0x10000 * 0x10001 = 0x100010000
           *   After truncation to size_t (32-bit): total = 0x10000
           *   → malloc(0x10000) returns a small buffer.
           * On 64-bit targets the overflow threshold is much larger
           * but still reachable with crafted input.
           */
          total = nmemb * size;          /* <-- no __builtin_mul_overflow */

          void *ptr = malloc(total);
          if (ptr == NULL) {
              return NULL;
          }
          memset(ptr, 0, total);         /* <-- zeroes only `total` bytes */
          return ptr;
      }

      /*
       * Typical caller in a network-facing QNX service:
       */
      void process_packet(uint32_t item_count, uint32_t item_size,
                          const uint8_t *payload) {
          /* Both item_count and item_size originate from untrusted packet. */
          uint8_t *buf = (uint8_t *)calloc(item_count, item_size);
          if (!buf) return;

          /*
           * Real allocated size is total = item_count * item_size (wrapped).
           * Copy uses the PRE-WRAP value → heap overflow.
           */
          memcpy(buf, payload, (size_t)item_count * item_size);
          handle_items(buf, item_count);
          free(buf);
      }

    ground_truth:
      has_vulnerability: true
      vulnerabilities:
        - vuln_id: CVE-2021-22156
          advisory_id: QNX-2021-001
          cwe: CWE-190
          vuln_type: integer_overflow
          secondary_type: heap_overflow
          severity: CRITICAL
          cvss_v3: "9.0 (AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H)"
          affected_versions:
            - "QNX SDP 6.5.0 SP1 and earlier"
            - "QNX OS for Medical 1.1 and earlier"
            - "QNX OS for Safety 1.0.1 and earlier"
          fixed_versions:
            - "QNX SDP 6.5.0 SP1 – patch from QNX-2021-001"
            - "QNX OS for Safety 1.0.2"
            - "QNX OS for Medical 1.1.1"
          min_impact: "DoS (crash) or RCE via heap corruption"
          remote_exploitable: true

          location_keywords:
            - calloc
            - nmemb
            - size
            - total
            - malloc
            - memset
            - memcpy
          evidence_keywords:
            - integer overflow
            - wraparound
            - size_t multiplication
            - undersized allocation
            - no overflow check
            - heap corruption
            - BadAlloc

          source_fields:
            - nmemb          # attacker-controlled element count
            - size           # attacker-controlled element size
          sink_ops:
            - "total = nmemb * size           # overflow here"
            - "malloc(total)                  # undersized buffer"
            - "memcpy(buf, payload, nmemb*size) # write past buffer end"

          root_cause: >
            calloc() performs the multiplication nmemb * size without any
            integer overflow check. When the product wraps around (32-bit
            or 64-bit), malloc() receives a value much smaller than the
            caller expects. The subsequent memcpy (or equivalent write) uses
            the pre-wrap product as the copy length, writing past the end of
            the allocated buffer into adjacent heap memory.

          trigger_concept: >
            Send a crafted network packet where item_count and item_size
            are chosen so their product overflows size_t. The service calls
            calloc(item_count, item_size) and then copies payload bytes using
            the un-checked product, triggering heap overflow.

          fix_description: >
            Add an explicit overflow check before the multiplication, e.g.:
              if (nmemb != 0 && size > SIZE_MAX / nmemb) return NULL;
            Alternatively replace with a checked multiply intrinsic.

    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2021-22156"
      - "https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-229a"
      - "https://us-cert.cisa.gov/ics/advisories/icsa-21-119-04"
      - "https://support.blackberry.com/kb/articleDetail?articleNumber=000078877"

    notes: >
      Positive control case. Ground truth confirmed by vendor advisory
      (BlackBerry QNX-2021-001), CISA AA21-229A, and NVD.
      Pattern thuộc nhóm "BadAlloc" (Microsoft Section 52 research).
      Mặc dù lỗi ở libc không phải qvm/vdev, nó là in-domain QNX và
      là gateway vulnerability quan trọng vì QNX network services
      (bao gồm guest-facing services khi dùng pass-through networking)
      đều link với libc này.


  # ---------------------------------------------------------------------------
  # CASE 2 – POSITIVE (Transfer case – QEMU virtio-net, pattern tương đồng
  #          với QNX vdev-virtio-net: guest-controlled struct size → stack OOB)
  # Pattern: Undersized stack buffer do dùng sai struct type khi HASH_REPORT
  #          được negotiate → stack overflow → info leak
  # Source: CVE-2023-6693
  # Confidence: CONFIRMED – upstream QEMU patch, Red Hat BZ#2254580, NVD
  # ---------------------------------------------------------------------------
  - case_id: qemu-virtio-net-tx-002
    title: "Stack overflow trong virtio_net_flush_tx() khi HASH_REPORT enabled"
    component: virtio-net (QEMU hw/net/virtio-net.c)
    binary_target: qemu-system-* (QEMU hypervisor process)
    tags:
      - buffer_overflow
      - stack_overflow
      - info_leak
      - positive
      - transfer_case
      - qemu
      - virtio
      - guest_controlled

    prompt: >
      Analyze virtio_net_flush_tx() focusing on the vnet header copy path.
      When guest negotiates VIRTIO_NET_F_HASH_REPORT, VIRTIO_F_VERSION_1,
      and VIRTIO_NET_F_MRG_RXBUF simultaneously, determine whether the
      local buffer used for the header swap is correctly sized for the
      actual guest_hdr_len. Identify the source field, the stack buffer,
      and whether an OOB write or information leak is possible.

    analysis_context: |
      Target binary: qemu-system-aarch64 / qemu-system-x86_64
      Trust boundary: guest OS controls negotiated feature bits and TX
      virtqueue descriptors. Host (qemu process) processes TX packets in
      virtio_net_flush_tx() running in the host userspace.
      Analogy to QNX: QNX vdev-virtio-net.so performs similar TX flush
      logic; the same pattern (wrong header type → undersized stack buffer)
      would apply if QNX's implementation uses a fixed-size local variable
      for the header swap without checking guest_hdr_len against it.
      Focus:
        1. Identify the local struct used for iov_to_buf (the header buffer).
        2. Determine its size vs. the maximum possible guest_hdr_len when
           HASH_REPORT is active (sizeof(virtio_net_hdr_v1_hash) > sizeof
           (virtio_net_hdr_mrg_rxbuf)).
        3. Assess whether the stack overflow allows local variable corruption
           and/or information disclosure via out_sg.

    source_code: |
      /*
       * QEMU hw/net/virtio-net.c – vulnerable version (before fix).
       * Simplified to the critical TX flush path.
       * CVE-2023-6693 / Fixes commit: see qemu-devel 2024-01 msg00045
       */

      /* Struct sizes (representative):
       *   virtio_net_hdr_mrg_rxbuf : 12 bytes  (v1 base + num_buffers)
       *   virtio_net_hdr_v1_hash   : 20 bytes  (v1 base + hash_value + hash_report_type)
       * When HASH_REPORT negotiated: guest_hdr_len = sizeof(virtio_net_hdr_v1_hash) = 20
       */

      static int32_t virtio_net_flush_tx(VirtIONetQueue *q)
      {
          VirtIONet *n = q->n;
          VirtIODevice *vdev = VIRTIO_DEVICE(n);
          VirtQueueElement *elem;
          int32_t num_packets = 0;

          while (num_packets < n->tx_burst) {
              struct iovec sg[VIRTQUEUE_MAX_SIZE];
              struct iovec sg2[VIRTQUEUE_MAX_SIZE + 1];
              struct iovec *out_sg;
              unsigned int out_num;
              ssize_t ret;

              /*
               * VULNERABLE: stack buffer sized for virtio_net_hdr_mrg_rxbuf
               * (12 bytes), but when HASH_REPORT is active, guest_hdr_len
               * is sizeof(virtio_net_hdr_v1_hash) = 20 bytes.
               * iov_to_buf() will write 20 bytes into a 12-byte stack slot.
               */
              struct virtio_net_hdr_mrg_rxbuf mhdr;  /* 12 bytes on stack */

              elem = virtqueue_pop(q->tx_vq, sizeof(VirtQueueElement));
              if (!elem) break;

              out_sg  = elem->out_sg;
              out_num = elem->out_num;

              if (n->has_vnet_hdr) {
                  /*
                   * iov_to_buf copies n->guest_hdr_len bytes FROM guest
                   * descriptors INTO &mhdr on the stack.
                   * When guest_hdr_len == 20 > sizeof(mhdr) == 12:
                   *   → 8-byte stack overflow (overwrites adjacent locals).
                   */
                  if (iov_to_buf(out_sg, out_num, 0,
                                 &mhdr,                  /* <-- too small */
                                 n->guest_hdr_len) <     /* <-- up to 20  */
                      n->guest_hdr_len) {
                      virtio_error(vdev, "virtio-net header incorrect");
                      virtqueue_detach_element(q->tx_vq, elem, 0);
                      g_free(elem);
                      return -EINVAL;
                  }

                  if (n->needs_vnet_hdr_swap) {
                      virtio_net_hdr_swap(vdev, (void *) &mhdr);
                      /*
                       * INFO LEAK: out_sg points at stack area after swap;
                       * if overflow corrupted adjacent memory, that memory
                       * (including host addresses) may be sent on the wire.
                       */
                      sg2[0].iov_base = &mhdr;
                      sg2[0].iov_len  = n->guest_hdr_len;  /* 20 bytes read from 12-byte buf */
                      out_num = iov_copy(&sg2[1], ARRAY_SIZE(sg2) - 1,
                                         out_sg, out_num,
                                         n->guest_hdr_len, -1);
                      out_sg = sg2;
                      out_num++;
                  }
              }

              ret = qemu_sendv_packet_async(qemu_get_subqueue(n->nic, q->index),
                                            out_sg, out_num,
                                            virtio_net_tx_complete);
              /* ... */
          }
          return num_packets;
      }

      /*
       * FIX (from upstream commit / qemu-devel 2024-01 msg00045):
       * Replace struct virtio_net_hdr_mrg_rxbuf mhdr
       * with   struct virtio_net_hdr_v1_hash     vhdr
       * which is 20 bytes – large enough for the HASH_REPORT header.
       */

    ground_truth:
      has_vulnerability: true
      vulnerabilities:
        - vuln_id: CVE-2023-6693
          cwe: CWE-121
          vuln_type: buffer_overflow
          secondary_type: info_leak
          severity: MEDIUM
          cvss_v3: "5.3 (AV:L/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:L)"
          affected_versions:
            - "QEMU 5.1.0-rc0 through 8.x (before fix)"
            - "Introduced by: commit e22f0603fb2f (v5.1.0-rc0)"
          fixed_versions:
            - "QEMU – upstream fix January 2024 (commit replacing mhdr with vhdr)"
          min_impact: "Stack variable corruption + potential information leak via wire"

          trigger_condition: >
            Guest must negotiate VIRTIO_NET_F_HASH_REPORT,
            VIRTIO_F_VERSION_1, and VIRTIO_NET_F_MRG_RXBUF simultaneously.
            After negotiation, guest_hdr_len = sizeof(virtio_net_hdr_v1_hash) = 20.
            Any TX packet then triggers the overflow in virtio_net_flush_tx().

          location_keywords:
            - virtio_net_flush_tx
            - iov_to_buf
            - mhdr
            - out_sg
            - guest_hdr_len
            - virtio_net_hdr_mrg_rxbuf
          evidence_keywords:
            - stack overflow
            - undersized local buffer
            - HASH_REPORT
            - guest_hdr_len exceeds sizeof mhdr
            - information leak
            - wire disclosure
            - header swap

          source_fields:
            - "n->guest_hdr_len     # set during feature negotiation, guest-controlled"
            - "elem->out_sg         # guest TX descriptor data"
          sink_ops:
            - "iov_to_buf(out_sg, out_num, 0, &mhdr, n->guest_hdr_len)  # 20 bytes into 12-byte mhdr"
            - "sg2[0].iov_base = &mhdr; sg2[0].iov_len = n->guest_hdr_len  # reads 20 from 12-byte stack"

          root_cause: >
            virtio_net_flush_tx() allocates a fixed-size local variable
            (struct virtio_net_hdr_mrg_rxbuf, 12 bytes) for the vnet header
            copy. When the guest negotiates HASH_REPORT, guest_hdr_len grows
            to 20 bytes (sizeof virtio_net_hdr_v1_hash). The subsequent
            iov_to_buf() call uses guest_hdr_len as the copy length, writing
            8 bytes past the stack buffer into adjacent local variables.
            The overflow additionally allows information from the overwritten
            stack region to be transmitted on the wire (info leak).

          fix_description: >
            Replace the local stack variable type from
            struct virtio_net_hdr_mrg_rxbuf (12 bytes) to
            struct virtio_net_hdr_v1_hash (20 bytes) so the buffer is
            always large enough for the maximum possible guest_hdr_len.
            Additionally add a comment in virtio_net_set_mrg_rx_bufs()
            warning that header type changes must be reflected in the TX path.

    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2023-6693"
      - "https://bugzilla.redhat.com/show_bug.cgi?id=2254580"
      - "https://lists.nongnu.org/archive/html/qemu-devel/2024-01/msg00045.html"
      - "https://ubuntu.com/security/CVE-2023-6693"

    notes: >
      Transfer case (QEMU). Pattern tương đồng với QNX vdev-virtio-net.so:
      nếu QNX sử dụng local stack buffer cố định cho header swap trong TX
      flush và không kiểm tra guest_hdr_len vs. sizeof(local_buf), cùng lỗi
      sẽ xuất hiện. Testcase này đánh giá khả năng RAG nhận ra pattern
      "undersized stack buffer + guest-controlled length" xuyên qua
      implementation khác nhau.
      Ground truth: confirmed upstream commit + Red Hat BZ + NVD.


  # ---------------------------------------------------------------------------
  # CASE 3 – NEGATIVE (Transfer case – QEMU virtio-snd với fix hoàn chỉnh)
  # Pattern: iov_to_buf với bounds check hợp lệ SAU khi patch CVE-2024-7730
  # Source: CVE-2024-7730 đã được patch (commit thêm guard vào max_size path)
  # Confidence: CONFIRMED – upstream QEMU patch (qemu-devel msg1171029)
  # ---------------------------------------------------------------------------
  - case_id: qemu-virtio-snd-rx-003
    title: "Hardened path – virtio_snd_pcm_in_cb() SAU khi patch CVE-2024-7730"
    component: virtio-snd (QEMU hw/audio/virtio-snd.c – patched version)
    binary_target: qemu-system-* (QEMU hypervisor process)
    tags:
      - negative
      - hardened
      - transfer_case
      - qemu
      - virtio
      - bounds_check_present

    prompt: >
      Analyze the virtio_snd_pcm_in_cb() function in its PATCHED form.
      Determine whether the iov size validation adequately prevents
      out-of-bounds writes when a guest supplies a virtio queue element
      whose in_sg total size equals exactly sizeof(virtio_snd_pcm_status).
      Specifically check whether max_size is correctly computed and
      whether the guard prevents the audio data write into a zero-size slot.

    analysis_context: |
      Target binary: qemu-system-* (post-patch, hw/audio/virtio-snd.c)
      Trust boundary: guest OS controls virtqueue descriptor sizes and
      audio parameters. Host processes audio data in virtio_snd_pcm_in_cb().
      Context: CVE-2024-7730 (heap OOB write) was present in the UNPATCHED
      version where max_size was NOT checked before being used as iov write
      limit. The PATCHED version adds a guard:
        if (max_size <= sizeof(virtio_snd_pcm_status)) { skip; continue; }
        max_size -= sizeof(virtio_snd_pcm_status);
      Analogy to QNX: QNX vdev-virtio-console.so and vdev-virtio-blk.so
      perform similar iov-based data movement from virtqueues; this testcase
      validates the correct pattern analysts should recognise as SAFE.
      Focus:
        1. Confirm the guard catches the edge case max_size == sizeof(status).
        2. Confirm max_size is correctly adjusted before use in write path.
        3. Verify no secondary path bypasses the guard.

    source_code: |
      /*
       * QEMU hw/audio/virtio-snd.c – PATCHED version (CVE-2024-7730 fixed).
       * Fix: commit adding bounds check before audio data write.
       * Original reporter: DARKNAVY.
       * Patch reference: qemu-devel [PULL 31/33] msg1171029
       */

      typedef struct virtio_snd_pcm_status {
          uint32_t status;
          uint32_t latency_bytes;
      } virtio_snd_pcm_status;  /* sizeof = 8 bytes */

      /*
       * Called by audio backend when audio input data is available.
       * `data`      – pointer to VirtIOSoundPCMBuffer
       * `available` – number of bytes available from audio backend
       */
      static void virtio_snd_pcm_in_cb(void *data, int available)
      {
          VirtIOSoundPCMBuffer *buffer = data;
          VirtIOSoundStream *stream   = buffer->stream;
          size_t max_size;

          /* Compute total iov capacity for this virtqueue element */
          max_size = iov_size(buffer->elem->in_sg,
                              buffer->elem->in_num);

          /*
           * PATCH (CVE-2024-7730 fix):
           * Guard: if the entire iov capacity is consumed by the
           * status struct alone, there is zero space for audio data.
           * Skip this buffer instead of writing 0 bytes or going negative.
           *
           * UNPATCHED code lacked this check, causing:
           *   max_size -= sizeof(virtio_snd_pcm_status)
           *   → max_size = 0 (or underflow to SIZE_MAX if < sizeof(status))
           *   → AUD_read(stream->voice.in, buffer->data, available)
           *     wrote `available` bytes (up to ~4096) past buffer->data end.
           */
          if (max_size <= sizeof(virtio_snd_pcm_status)) {  /* GUARD – CORRECT */
              return_rx_buffer(stream, buffer);
              /* Jump to next buffer, no write performed */
              /* (loop continues at caller) */
              return;
          }

          /* Safe: max_size > sizeof(status), so subtraction won't underflow */
          max_size -= sizeof(virtio_snd_pcm_status);  /* space for audio data */

          for (;;) {
              /*
               * buffer->size tracks bytes already filled in buffer->data.
               * If buffer is full (>= max_size), return it to guest.
               */
              if (buffer->size >= max_size) {
                  return_rx_buffer(stream, buffer);
                  break;
              }

              /*
               * AUD_read writes at most MIN(available, period_bytes - buffer->size)
               * into buffer->data.  buffer->data was allocated with:
               *   size = iov_size(elem->in_sg, elem->in_num) - sizeof(status)
               * which matches max_size. No overflow.
               */
              int to_read = (int)MIN((size_t)available,
                                     max_size - buffer->size);
              if (to_read <= 0) break;

              int bytes_read = AUD_read(stream->voice.in,
                                        buffer->data + buffer->size,
                                        to_read);
              if (bytes_read <= 0) break;

              buffer->size += (size_t)bytes_read;
              available    -= bytes_read;

              if (available <= 0) break;
          }
      }

    ground_truth:
      has_vulnerability: false
      vulnerabilities: []
      rationale: >
        The PATCHED version correctly validates max_size before computing
        available audio space. The guard `if (max_size <= sizeof(status))`
        catches both the exact-match edge case (max_size == 8) and any case
        where the element is too small to hold even the status struct. After
        the guard, max_size -= sizeof(status) is safe (no underflow). The
        AUD_read write is bounded by the correctly-computed max_size which
        matches the allocation size of buffer->data. No guest-controlled
        value can produce an OOB write in this patched path.
      what_was_vulnerable_before: >
        CVE-2024-7730 (UNPATCHED): max_size was subtracted without the
        guard. When guest set element size == sizeof(virtio_snd_pcm_status),
        max_size became 0 after subtraction. AUD_read then wrote up to
        `available` bytes (typically ~4096 from ALSA backend) past the end
        of buffer->data, causing heap corruption (CWE-122).

    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2024-7730"
      - "http://www.mail-archive.com/qemu-devel@nongnu.org/msg1171029.html"
      - "http://www.mail-archive.com/qemu-devel@nongnu.org/msg1170838.html"
      - "https://ubuntu.com/security/CVE-2024-7730"

    notes: >
      Negative control case (hardened path). Analyst được cung cấp code
      đã được patch – câu trả lời đúng là "không có lỗ hổng ở đây".
      Mục đích: kiểm tra false positive rate của pipeline phân tích.
      Pattern quan trọng để RAG học: guard `<= sizeof(header_struct)`
      trước subtraction là pattern chuẩn cho iov-based vdev audio/block.
      Analogy: QNX vdev-virtio-console.so nên có cùng guard trước khi
      dùng iov size để bound write vào host-side buffer.