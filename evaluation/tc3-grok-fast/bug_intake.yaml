  # ---------------------------------------------------------------------------
  # CASE 3 - NEGATIVE (real fixed code)
  # Post-fix variant related to virtio length handling (e.g., improved bounds in virtio-blk/scsi push path)
  # ---------------------------------------------------------------------------
  - case_id: qemu-virtio-blk-scsi-push-8612-003
    title: "virtio-blk/scsi completion push with size validation (post-fix upstream code)"
    component: "qemu hw/virtio/virtio-blk.c (and similar in virtio-scsi)"
    tags:
      - transfer_case
      - qemu
      - virtio
      - guest_to_host
      - post_fix
      - negative_control

    prompt: >
      Evaluate the completion handling and virtqueue_push path in this revised virtio block/scsi code. Determine whether guest-influenced sizes can still cause unsafe writes or information exposure.

    analysis_context: |
      Target binary: qemu-system-*
      Trust boundary: guest virtqueue elements and completion data.
      Scope: only this excerpt.
      Note: this is a fixed-version candidate and should be judged by code behavior.

    # Verbatim excerpt from post-fix (size is now properly capped before push/unmap)
    source_code: |
      /* Post-fix example in virtio_blk_req_complete / virtio_scsi_complete_req */
      static void virtio_blk_req_complete(VirtIOBlockReq *req)
      {
          /* ... */
          size_t len = MIN(req->in_len, actual_data_size);  /* Added bound */
          virtqueue_push(req->vq, &req->elem, len);
          /* ... */
      }

      /* Similar pattern ensures size <= true buffer capacity before dma_memory_unmap and address_space_write */

    ground_truth:
      has_vulnerability: false
      vulnerabilities: []

    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2024-8612"
      - "https://gitlab.com/qemu-project/qemu/-/commit/637b0aa139565cb82a7b9269e62214f87082635c"

    notes: >
      Provenance: upstream QEMU post-fix for related info-leak path. Size is now correctly bounded to prevent writing beyond actual data sent to guest.