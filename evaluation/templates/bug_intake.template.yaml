cases:
  - case_id: qnx-vdev-shmem-001
    title: Unvalidated guest length into memcpy path
    component: vdev-shmem
    tags: [buffer_overflow, positive, qnx, ivc]
    prompt: Analyze function vdshmem_vwrite with focus on guest-controlled length and memcpy usage.
    analysis_context: |
      Target binary: qvm
      Trust boundary: guest-controlled shared memory input into host-side copy operations.
      Focus: validate source->sink path and check bound validation before memcpy.
    source_code: |
      // Paste source/decompiled snippet to analyze here.
      ssize_t vdshmem_vwrite(...) {
          // ...
      }
    ground_truth:
      has_vulnerability: true
      vulnerabilities:
        - vuln_id: CVE-YYYY-XXXXX
          vuln_type: buffer_overflow
          severity: HIGH
          min_impact: DoS (local)
          location_keywords: [vdshmem_vwrite, memcpy, guest_len]
          evidence_keywords: [guest-controlled, length, bounds]
          source_fields: [guest_len]
          sink_ops: ["memcpy(dst, src, guest_len)"]
          root_cause: Missing upper-bound validation on guest-controlled length before copy.
          trigger_concept: Oversized guest_len reaches memcpy unchanged.
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-YYYY-XXXXX
      - https://vendor.example/security/advisory
    notes: Positive control case with explicit source->sink evidence.

